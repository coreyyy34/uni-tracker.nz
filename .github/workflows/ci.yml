name: CI

on:
    push:
        branches: ["**"]

permissions:
    checks: write
    pull-requests: write
    contents: read
    packages: write

env:
    DOCKER_IMAGE: ghcr.io/${{ github.repository }}

jobs:
    setup:
        name: Setup
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-gradle

            - name: Warm Gradle Cache
              working-directory: backend
              run: |
                  chmod +x ./gradlew
                  ./gradlew help --no-daemon

    lint:
        name: "${{ matrix.module }} - Ktlint Check"
        runs-on: ubuntu-latest
        needs: setup
        strategy:
            fail-fast: false
            matrix:
                module: [shared, auth, api]
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/run-gradle-task
              with:
                  task: ":${{ matrix.module }}:ktlintCheck"
                  parallel: false

            - name: Upload ktlint reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.module }}-ktlint-reports
                  path: backend/${{ matrix.module }}/build/reports/ktlint/**/*.*
                  retention-days: 1

    unit-tests:
        name: "${{ matrix.module }} - Unit Tests"
        runs-on: ubuntu-latest
        needs: [setup]
        strategy:
            fail-fast: false
            matrix:
                module: [shared, auth, api]
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/run-gradle-task
              with:
                  task: ":${{ matrix.module }}:test"
                  parallel: false

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.module }}-unit-tests
                  path: backend/${{ matrix.module }}/build/test-results/test/**/*.xml
                  retention-days: 1

    integration-tests:
        name: "${{ matrix.module }} - Integration Tests"
        runs-on: ubuntu-latest
        needs: [setup]
        strategy:
            fail-fast: false
            matrix:
                module: [auth, api]
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/run-gradle-task
              with:
                  task: ":${{ matrix.module }}:testIntegration"
                  parallel: false

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.module }}-integration-tests
                  path: backend/${{ matrix.module }}/build/test-results/testIntegration/**/*.xml
                  retention-days: 1

    report-tests:
        name: Combined Tests
        runs-on: ubuntu-latest
        needs: [lint, unit-tests, integration-tests]
        if: always()
        steps:
            - name: Download all test results
              uses: actions/download-artifact@v4
              with:
                  path: test-results

            - name: Publish Combined Test Results
              if: always()
              uses: EnricoMi/publish-unit-test-result-action@v2
              with:
                  files: test-results/**/*.xml
                  check_name: "All Test Results"

    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: [lint, unit-tests, integration-tests]
        if: ${{ github.ref_name == 'main' || github.ref_name == 'dev' }}
        strategy:
            matrix:
                service:
                    - name: frontend
                      context: frontend
                      dockerfile: frontend/Dockerfile
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.service.context }}
                  file: ${{ matrix.service.dockerfile }}
                  push: true
                  tags: |
                      ${{ env.DOCKER_IMAGE  }}-${{ matrix.service.name }}:${{ github.ref_name }}-${{ github.sha }}
                      ${{ env.DOCKER_IMAGE  }}-${{ matrix.service.name }}:${{ github.ref_name }}-latest
                  cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.service.name }}:buildcache,mode=max
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.service.name }}:buildcache
                  outputs: type=registry

    deploy-staging:
        name: Staging Deploy to K3s
        runs-on: ubuntu-latest
        needs: [build-and-push]
        if: ${{ github.ref_name == 'dev' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up kubectl
              uses: azure/setup-kubectl@v4
              with:
                  version: "latest"

            - name: Configure Kubeconfig
              env:
                  KUBECONFIG_DATA: ${{ secrets.K3S_KUBECONFIG }}
              run: |
                  mkdir -p $HOME/.kube
                  echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
                  chmod 600 $HOME/.kube/config

            - name: Verify cluster access
              run: kubectl get nodes

            - name: Deploy to K3s
              run: |
                  kubectl create namespace uni-tracker-stg --dry-run=client -o yaml | kubectl apply -f -
                  kubectl apply -k kubernetes/overlays/stg
