apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: uni-tracker-ingress
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
        traefik.ingress.kubernetes.io/router.tls: "false"
spec:
    rules:
        - host: stg.uni-tracker.nz
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: frontend-service
                            port:
                                number: 80
